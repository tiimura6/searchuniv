<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Searchuniv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1d2433; --muted:#6b7280; --line:#e4e0d6;
  --accent:#1f4e79; --accent-soft:#e6eef7; --ok:#2f7d4f; --ng:#b4442f;
  --c-teidai:#7a2e3a; --c-kanto:#1f4e79; --c-chiho:#2d6a6a; --c-souke:#5b3a8c;
  --c-march:#a1532a; --c-kankan:#8a6d1d; --c-chuken:#456b2f; --c-rikou:#2b5c8a;
  --c-iryo:#a03a5a; --c-joshi:#9a4f86; --c-kokusai:#2c7a8a; --c-ibaraki:#6b4f2a;
  --c-daigakkou:#33475b; --c-senmon:#b06a1a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181d; --panel:#20232a; --ink:#e8e6e1; --muted:#9aa0aa; --line:#30343c; --accent:#7fb0e0; --accent-soft:#25303d; }
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{padding:20px 20px 8px;max-width:880px;margin:0 auto}
.byline{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-left:6px}
h1{font-size:20px;margin:0 0 4px;font-weight:700;letter-spacing:.02em}
.sub{font-size:12.5px;color:var(--muted);margin:0}
main{max-width:880px;margin:0 auto;padding:8px 20px 40px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.chip[aria-pressed="true"]{color:#111}}
.chip .n{opacity:.7;margin-left:4px;font-size:11px}
select,input[type=search],button.btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px}
button.btn{cursor:pointer}
button.btn:hover{border-color:var(--accent)}
input[type=search]{flex:1;min-width:160px}
.stage{perspective:1400px;margin:14px 0}
.card{position:relative;width:100%;height:min(74vh,700px);min-height:420px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.card.flipped .front{pointer-events:none;visibility:hidden;transition:visibility 0s .25s}
.card:not(.flipped) .back{pointer-events:none;visibility:hidden;transition:visibility 0s .25s}
.face{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 28px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);overflow:auto}
.face::before{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:var(--art) no-repeat center bottom/min(100%,560px) auto;opacity:.16;pointer-events:none;z-index:0}
@media (prefers-color-scheme: dark){.face::before{opacity:.22;filter:invert(1)}}
.face>*{position:relative;z-index:1}
.back::before{opacity:.08}
.front{align-items:center;justify-content:flex-start;text-align:center}
.back{transform:rotateY(180deg)}
.badge{display:inline-block;font-size:11.5px;font-weight:500;color:#fff;border-radius:6px;padding:2px 8px;margin-right:6px}
.meta{font-size:12.5px;color:var(--muted);margin-top:10px}
.uname{font-size:clamp(26px,5vw,38px);font-weight:700;margin:14px 0 4px;letter-spacing:.03em}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--muted)}
.back h2{font-size:18px;margin:6px 0 10px}
.back ul{margin:0 0 12px;padding-left:1.2em}
.back li{margin:4px 0;font-size:14.5px}
.memo{margin-top:auto;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13.5px}
.memo b{display:block;color:var(--accent);font-size:12px;margin-bottom:2px}
.qfront{font-size:15.5px;text-align:left;max-width:620px}
.qfront ul{padding-left:1.2em}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nav .grp{display:flex;gap:8px}
.big{padding:10px 16px!important;font-size:14px!important}
.ok{border-color:var(--ok)!important;color:var(--ok)!important}
.ng{border-color:var(--ng)!important;color:var(--ng)!important}
.progress{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.bar>div{height:100%;background:var(--ok);transition:width .3s}
.status{font-size:12px;font-weight:700;margin-left:6px}
.status.k{color:var(--ok)} .status.u{color:var(--ng)}
.empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px;border:1px dashed var(--line)}
.foot{margin-top:24px;font-size:11.5px;color:var(--muted)}
details{margin-top:24px;font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer}
.listview{display:none;margin-top:14px}
.listview table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border-radius:12px;overflow:hidden}
.listview th,.listview td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.listview th{font-weight:500;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs a{font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--panel)}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.tabs a.on{color:#111}}
.kind{display:inline-block;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 9px;letter-spacing:.05em;vertical-align:middle}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#jmap .dot{opacity:.9 !important}
#jmap .clus{cursor:pointer}
#jmap .clus circle{fill:var(--accent);opacity:.85;stroke:var(--panel);stroke-width:2px;vector-effect:non-scaling-stroke}
#jmap .clus text{fill:#fff;font-weight:700;pointer-events:none}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoomctl .btn{width:34px;height:34px;padding:0;font-size:18px;line-height:1}
#jmap{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#jmap.drag{cursor:grabbing}
#jmap .ulbl{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:2.5px;vector-effect:non-scaling-stroke;cursor:pointer}
body.wide main,body.wide header{max-width:1320px}
.sgrid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;align-items:start;margin-top:6px}
.sleft{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 150px);overflow:auto;padding-right:4px}
.sright{position:sticky;top:10px}
.sbar{display:flex;gap:8px}
.sbar input{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);color:var(--ink)}
.sfilt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sfilt select{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);color:var(--ink)}
.chk{font-size:12.5px;display:flex;align-items:center;gap:4px;cursor:pointer}
.kchk{display:flex;flex-wrap:wrap;gap:4px 12px;width:100%}
.kchk i{display:inline-block;width:9px;height:9px;border-radius:50%}
.mcount{font-size:12px;color:var(--muted)}
.mresults{display:flex;flex-direction:column;gap:4px;max-height:min(60vh,520px);overflow-y:auto;overscroll-behavior:contain}
.ritem{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;font-family:inherit}
.ritem:hover{border-color:var(--accent)}
.ritem .rn{font-weight:700;font-size:14px}
.ritem .rp{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.ritem .kind{font-size:10.5px;padding:1px 6px}
.mpanel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pfeat{margin:8px 0;padding-left:1.2em;font-size:13.5px}
#jmap .dot.dim{opacity:.15 !important}
#jmap{max-height:calc(100vh - 150px)}
@media (max-width:860px){.sgrid{grid-template-columns:1fr}.sleft{max-height:none;overflow:visible}.sright{position:static}}
.mapwrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:6px}
#jmap{width:100%;height:auto;display:block;max-height:72vh}
#jmap path{fill:var(--bg);stroke:var(--muted);stroke-width:.8px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#jmap .dot{fill:var(--accent);opacity:.45;cursor:pointer}
#jmap .dot:hover{opacity:1}
#jmap .hl{fill:#e0533d;stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
#jmap .pulse{fill:none;stroke:#e0533d;stroke-width:2px;vector-effect:non-scaling-stroke;animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(4)}}
#jmap .lbl{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;vector-effect:non-scaling-stroke}
.mpanel{margin-top:10px}
.mpanel .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.mpanel h3{margin:0 0 4px;font-size:17px}
.mpanel .meta{margin-top:0}
.nlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.nitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px}
.nitem .nh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.nitem .nu{color:var(--accent);font-weight:700}
.nitem a.nt{display:block;color:var(--ink);font-weight:700;text-decoration:none;margin:3px 0}
.nitem a.nt:hover{text-decoration:underline}
.nitem .ns{font-size:12.5px;color:var(--muted)}
.star{border:0;background:none;cursor:pointer;font-size:16px;color:var(--muted);padding:0 2px;line-height:1}
.star.on{color:#e0a400}
.cnews{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0 10px;font-size:13px}
.cnews .h{font-weight:700;font-size:12px;color:var(--accent);margin-bottom:4px}
.cnews li{font-size:12.5px;margin:2px 0}
.cnews a{color:var(--ink)}
.aiform{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:6px}
.aiform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.aiform input,.aiform select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.airow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.aibtns{display:flex;gap:8px}
.aistatus{font-size:13px;color:var(--muted);margin:10px 2px}
.aiout{display:flex;flex-direction:column;gap:10px}
.airec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.airec h3{margin:0 0 4px;font-size:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.airec .rk{color:var(--accent);font-size:13px}
.airec .why{font-size:13.5px;margin:6px 0}
.airec .pts{margin:4px 0 6px;padding-left:1.1em;font-size:12.5px}
.airec .caut{font-size:12px;color:var(--ng)}
.airec .acts{display:flex;gap:10px;margin-top:6px;align-items:center}
.tabs{flex-wrap:wrap}
.info{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0 10px;font-size:13px}
.it{width:100%;border-collapse:collapse}
.it th{width:7.2em;text-align:left;vertical-align:top;font-weight:500;color:var(--muted);font-size:12px;padding:5px 8px 5px 0;white-space:nowrap}
.it td{padding:5px 0;border-bottom:1px dashed var(--line)}
.it tr:last-child td{border-bottom:0}
.sub2{font-size:11.5px;color:var(--muted);margin-left:2px}
.facs{display:flex;flex-wrap:wrap;gap:4px}
.facs span{background:var(--accent-soft);border-radius:5px;padding:1px 7px;font-size:12px}
ul.mini{margin:0;padding-left:1.1em}
ul.mini li{font-size:12.5px;margin:2px 0}
.hp{font-size:12.5px;font-weight:500;margin-left:10px;color:var(--accent);white-space:nowrap}
.ff{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;background:color-mix(in srgb,var(--panel) 85%,transparent);border-radius:8px}
.ff th{width:6.8em;text-align:left;font-weight:500;color:var(--muted);padding:4px 8px 4px 0;vertical-align:top;white-space:nowrap}
.ff td{padding:4px 0;border-bottom:1px dashed var(--line)}
.ff tr:last-child td{border-bottom:0}
.ff .facs span{font-size:11.5px}
.qfront{max-width:680px!important}
.hints{margin-top:10px}
.hints .btn{font-size:12.5px;padding:5px 10px}
.hint1{font-size:13px;margin:4px 0;text-align:left}
.hint1 b{display:inline-block;font-size:11.5px;color:var(--accent);margin-right:8px;min-width:6.5em}
.guide{border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin:6px 0 10px;background:var(--accent-soft);font-size:13px}
.guide .gh{font-weight:700;color:var(--accent);font-size:13px;margin-bottom:4px}
.guide .it th{width:7.6em}
.simlink{color:var(--accent)}
.exam{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 12px;font-size:13px}
.exam-h{font-weight:700;font-size:12.5px;color:var(--accent);margin-bottom:6px}
.meth{margin-top:10px}
.msum{font-size:12.5px;margin-bottom:6px}
.mrow{border-top:1px dashed var(--line);padding:6px 0}
.mh{font-weight:700;font-size:13px}
.ktag{display:inline-block;color:#fff;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.md{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;margin-top:2px}
.md b{color:var(--muted);font-weight:500;margin-right:2px}
.mn{font-size:11.5px;color:var(--muted);margin-top:2px}
.et{width:100%;border-collapse:collapse}
.et th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:left;padding:2px 6px 4px 0;border-bottom:1px solid var(--line)}
.et td{padding:4px 6px 4px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.et .yr{font-size:10.5px;color:var(--muted);margin-left:4px}
.et .prev{font-size:11px;color:var(--muted);margin-left:4px}
.fmt{margin-top:8px;font-size:12.5px}
.enote,.na{margin-top:6px;font-size:11.5px;color:var(--muted)}
.src{margin-top:6px;font-size:11px;color:var(--muted)}
.src a{color:var(--accent)}
.listview .hp{font-size:12.5px;font-weight:500;margin-left:10px;color:var(--accent);white-space:nowrap}
.exam{margin:0;border:0;padding:0}
.ans{margin:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:10px}
.blank{display:flex;align-items:baseline;justify-content:center;font-size:clamp(22px,4.5vw,30px);font-weight:700;flex-wrap:nowrap}
.blank input{width:9em;max-width:52vw;font-family:inherit;font-size:inherit;font-weight:700;text-align:center;border:0;border-bottom:3px solid var(--accent);background:transparent;color:var(--ink);padding:2px 4px;margin:0 2px}
.blank input:focus{outline:none;background:var(--accent-soft)}
.ansbtns{display:flex;gap:8px}
.judge{font-size:18px;font-weight:700;margin-top:6px}
.judge .good{color:var(--ok)} .judge .bad{color:var(--ng)}
.judge .yours{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:2px}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
</style>
</head>
<body>
<header>
  <h1>Searchuniv <span class="byline">designed by Takahiro Iimura</span></h1>
  <nav class="tabs"><a href="#map" data-v="map">検索</a><a href="#cards" data-v="cards">カード</a><a href="#news" data-v="news">ニュース</a><a href="#ai" data-v="ai">AIおすすめ</a></nav>
</header>
<main>
<section id="v-cards">
  <div class="controls">
    <input type="search" id="q" placeholder="検索">
    <select id="mode" aria-label="出題方向">
      <option value="type" selected>入力</option>
      <option value="name">大学名→特色</option>
      <option value="feat">特色→大学名</option>
    </select>
    <select id="kindf" aria-label="種別"><option value="">全種別</option><option value="pub">国公立（私立を除く）</option><option>国立</option><option>公立</option><option>私立</option><option>大学校</option><option>専門職大学</option></select>
    <select id="filt" aria-label="学習状況">
      <option value="all">すべて</option>
      <option value="unknown">まだ</option>
      <option value="unseen">未判定</option>
    </select>
    <button class="btn" id="toggleList">一覧</button>
  </div>

  <div class="progress"><span id="pos"></span>　<span id="stat"></span>　<span id="score" style="color:var(--ok);font-weight:500"></span></div>
  <div class="bar"><div id="barfill" style="width:0"></div></div>

  <div id="cardwrap">
    <div class="stage"><div class="card" id="card" tabindex="0" aria-live="polite">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div></div>
    <div class="nav">
      <div class="grp"><button class="btn big" id="prev">←</button><button class="btn big" id="next">→</button></div>
      <div class="grp"><button class="btn big ng" id="markU">まだ</button><button class="btn big ok" id="markK">覚えた</button></div>
    </div>
  </div>
  <div class="listview" id="listview"></div>

  <p class="foot">入試データは2026年度（出典は各カード）。倍率＝受験者÷合格者（受験者不明は志願者÷合格者）。総合型は最終合格者で算出。出願前に最新の募集要項で確認。</p>
</section>

<section id="v-map" hidden>
  <div class="sgrid">
    <div class="sleft">
      <div class="sbar"><input type="search" id="mq" placeholder="大学名・読み・学部・地域で検索" autocomplete="off"><button class="btn" id="mreset">全国</button></div>
      <div class="sfilt">
        <select id="f-kyoka" aria-label="共通テスト科目数"><option value="">共テ教科数：すべて</option><option value="le3">3教科以下</option><option value="4-5">4〜5教科</option><option value="ge6">6教科以上</option><option value="none">共テ利用なし</option></select>
        <select id="f-meth" aria-label="入試方式"><option value="">入試方式：すべて</option><option value="kouki">後期日程あり</option><option value="nijiH">二次（個別）重視</option><option value="ktH">共テ重視</option><option value="suisen">公募推薦あり</option><option value="sk_nokt">推薦・総合型で共テ不要あり</option><option value="sogo">総合型あり</option><option value="ktriyo">共テ利用方式あり（私立）</option></select><select id="f-rl" aria-label="英語R:L比率"><option value="">英語R:L：すべて</option><option value="1:1">1:1（均等）</option><option value="r">リーディング重視（3:1・4:1など）</option><option value="other">その他の比率</option></select>

function yen(n){ return n===0 ? "0円" : (n==null?"—":(Math.round(n/1000)/10).toLocaleString("ja-JP",{maximumFractionDigits:1})+"万円"); }
function kyotsuText(f){ const k=f&&f.kyotsu; if(!k||!k.kamoku) return ""; return esc(k.kamoku)+(k.rl_text?'<span class="sub2">（英語 '+esc(k.rl_text)+'）</span>':(k.rl&&k.rl.length?'<span class="sub2">（英語 R:L='+esc(k.rl.join("／"))+'）</span>':'')); }
function infoBlock(name){
  const f = INFO[name]; if(!f) return "";
  const rows=[];
  const d=f.difficulty;
  if(f.kyotsu&&f.kyotsu.kamoku) rows.push(["共通テスト",kyotsuText(f)+(f.kyotsu.note?'<div class="sub2">'+esc(f.kyotsu.note)+'</div>':'')]);
  if(d && (d.hensachi||d.kyotei)) rows.push(["難易度",[d.hensachi?"偏差値 "+esc(d.hensachi):"",d.kyotei?"共テ "+esc(d.kyotei):""].filter(Boolean).join("／")]);
  const t=f.tuition;
  if(t && t.amount!=null) rows.push(["初年度納付金", "<b>"+yen(t.amount)+"</b>"+(t.label?'<span class="sub2">（'+esc(t.label)+'）</span>':"")]);
  const st=f.students;
  const scale=[st&&st.count?("学生 約"+Number(st.count).toLocaleString("ja-JP")+"人"+(st.note?"（"+esc(st.note)+"）":"")):"", f.founded?esc(f.founded):""].filter(Boolean).join("／");
  if(scale) rows.push(["規模・創立",scale]);
  if(f.access) rows.push(["アクセス",esc(f.access)]);
  if(f.faculties && f.faculties.length) rows.push(["学部",'<span class="facs">'+f.faculties.map(x=>'<span>'+esc(x)+'</span>').join("")+'</span>']);
  if(f.research && f.research.length) rows.push(["有名な研究分野",'<span class="facs">'+f.research.map(x=>'<span>'+esc(x)+'</span>').join("")+'</span>']);
  if(f.licenses && f.licenses.length) rows.push(["取得できる資格",'<span class="facs">'+f.licenses.map(x=>'<span>'+esc(x)+'</span>').join("")+'</span>']);
  if(f.careers) rows.push(["主な進路",esc(f.careers)]);
  if(f.news && f.news.length) rows.push(["ニュース",'<ul class="mini">'+f.news.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>']);
  if(f.notable && f.notable.length) rows.push(["著名な教員",'<ul class="mini">'+f.notable.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>']);
  if(!rows.length) return "";
  const src=(f.sources||[]).filter(u=>/^https?:/.test(u)).slice(0,6);
  const srcH = src.length?'<div class="src">出典：'+src.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+srcLabel(u)+'</a>').join("／")+'</div>':"";
  return '<div class="info"><table class="it">'+rows.map(r=>'<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>').join("")+'</table>'+srcH+'</div>';
}

function fmtN(n){ return (n===null||n===undefined||n==="")?"—":Number(n).toLocaleString("ja-JP"); }
function fmtR(r){ return (r===null||r===undefined||r==="")?"—":Number(r).toFixed(1)+"倍"; }
const KUBUN_COLOR={"一般":"#1f4e79","共テ利用":"#5b4b8a","推薦":"#2a7f62","総合型":"#b0532a","その他":"#4b5563"};
function methodsHTML(name){
  const m=(INFO[name]||{}).methods; if(!m||!(m.list||[]).length) return "";
  let h='<div class="meth"><div class="exam-h">入試方式'+(m.year?'<span class="yr">（'+esc(m.year)+'）</span>':'')+'</div>';
  if(m.summary) h+='<div class="msum">'+esc(m.summary)+'</div>';
  for(const r of m.list){
    const parts=[];
    if(r.kyotsu) parts.push('<span><b>共テ</b> '+esc(r.kyotsu)+'</span>');
    if(r.niji) parts.push('<span><b>'+(/国立|公立/.test((items.find(x=>x.name===name)||{}).type||"")?"二次":"個別")+'</b> '+esc(r.niji)+'</span>');
    if(r.content) parts.push('<span><b>選考</b> '+esc(r.content)+'</span>');
    if(r.haiten) parts.push('<span><b>配点</b> '+esc(r.haiten)+'</span>');
    if(r.req) parts.push('<span><b>条件</b> '+esc(r.req)+'</span>');
    h+='<div class="mrow"><div class="mh"><span class="ktag" style="background:'+(KUBUN_COLOR[r.kubun]||"#4b5563")+'">'+esc(r.kubun||"")+'</span>'+esc(r.name||"")+'</div>'+(parts.length?'<div class="md">'+parts.join("")+'</div>':'')+(r.note?'<div class="mn">'+esc(r.note)+'</div>':'')+'</div>';
  }
  if(m.note) h+='<div class="enote">※'+esc(m.note)+'</div>';
  return h+'</div>';
}
function examBlock(name, compact){
  const e = EXAM[name], mh=methodsHTML(name);
  if(!e) return mh?'<div class="exam">'+mh+'</div>':"";
  const rows = [["一般選抜",e.general],["学校推薦型",e.suisen],["総合型",e.sogo]].filter(r=>r[1]);
  let h = '<div class="exam">';
  if(rows.length){
    h += '<table class="et"><thead><tr><th>区分</th><th>志願者</th><th>合格者</th><th>倍率</th></tr></thead><tbody>';
    for(const [lab,v] of rows){
      const prev = (v.ratio_prev!=null)?'<span class="prev">（前年 '+fmtR(v.ratio_prev)+'）</span>':'';
      h += '<tr><td>'+lab+'<span class="yr">'+(v.year||"")+'</span></td><td>'+fmtN(v.applicants)+'</td><td>'+fmtN(v.passers)+'</td><td><b>'+fmtR(v.ratio)+'</b>'+prev+'</td></tr>';
    }
    h += '</tbody></table>';
  } else {
    h += '<div class="na">倍率データなし</div>';
  }
  if(e.format && !mh) h += '<div class="fmt">'+esc(e.format)+'</div>';
  h += mh;
  if(!compact){
    if(e.note) h += '<div class="enote">※'+esc(e.note)+'</div>';
    if(e.sources && e.sources.length) h += '<div class="src">出典：'+e.sources.slice(0,3).map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+srcLabel(u)+'</a>').join("／")+'</div>';
  }
  return h+'</div>';

function midHensachi(name){ const d=(INFO[name]||{}).difficulty; if(!d||!d.hensachi) return null; const nums=String(d.hensachi).match(/[\d.]+/g); if(!nums) return null; const v=nums.map(Number); return (Math.min(...v)+Math.max(...v))/2; }
function groupOf(x){ const k=kindOf(x); return (k==="国立"||k==="公立")?"pub":(k==="私立"?"pri":k); }
function similarSchools(x,n){
  const m=midHensachi(x.name); if(m==null) return [];
  const g=groupOf(x), r=regionOf(x.pref);
  return items.filter(y=>y!==x&&groupOf(y)===g&&y.name!=="電動モビリティシステム専門職大学").map(y=>({y,m:midHensachi(y.name)})).filter(o=>o.m!=null&&Math.abs(o.m-m)<=2.5)
    .sort((a,b)=>((regionOf(a.y.pref)===r?0:1)-(regionOf(b.y.pref)===r?0:1))||Math.abs(a.m-m)-Math.abs(b.m-m)).slice(0,n).map(o=>o.y);
}
function man(n){ const v=Math.round(n/1000)/10; return v.toLocaleString("ja-JP",{maximumFractionDigits:1})+"万円"; }
function guideBlock(x,ctx){
  const f=INFO[x.name]||{}, e=EXAM[x.name]||{}, gd=GUIDE[x.name]||{}; const rows=[];
  if(gd.fit) rows.push(["向いている生徒",esc(gd.fit)]);
  const d=f.difficulty, mk=[];
  if(d&&d.hensachi) mk.push("偏差値 "+esc(d.hensachi)); if(d&&d.kyotei) mk.push("共テ "+esc(d.kyotei));
  if(e.general&&e.general.ratio!=null) mk.push("一般 "+Number(e.general.ratio).toFixed(1)+"倍"+(e.general.ratio_prev!=null?"（前年 "+Number(e.general.ratio_prev).toFixed(1)+"倍）":""));
  if(e.suisen&&e.suisen.ratio!=null) mk.push("推薦 "+Number(e.suisen.ratio).toFixed(1)+"倍");
  if(e.sogo&&e.sogo.ratio!=null) mk.push("総合型 "+Number(e.sogo.ratio).toFixed(1)+"倍");
  if(mk.length) rows.push(["入試の目安",mk.join("／")]);
  { const ms=((INFO[x.name]||{}).methods||{}).summary; if(ms) rows.push(["入試方式",esc(ms)]); else if(e.format) rows.push(["入試方式",esc(e.format)]); }
  if(gd.ask&&gd.ask.length) rows.push(["面談で確認",'<ul class="mini">'+gd.ask.map(a=>'<li>'+esc(a)+'</li>').join("")+'</ul>']);
  if(gd.caution) rows.push(["注意点",esc(gd.caution)]);
  const t=f.tuition; if(t&&t.amount){ const r=t.amount/817800; rows.push(["費用感","初年度 約"+man(t.amount)+(kindOf(x)==="私立"||kindOf(x)==="専門職大学"?"（国立標準額の約"+r.toFixed(1)+"倍）":"")]); }
  else if(t&&t.amount===0) rows.push(["費用感",esc(t.label||"学費不要")]);
  const sim=similarSchools(x,3);
  if(sim.length) rows.push(["難易度が近い学校",sim.map(y=>'<a href="#" class="simlink" data-n="'+esc(y.name)+'">'+esc(y.name)+'</a>').join("・")+'<span class="sub2">（偏差値帯の中央が±2.5以内・同じ設置区分、同じ地域を優先）</span>']);
  if(x.memo) rows.push(["メモ",esc(x.memo)]);
  if(!rows.length) return "";
  return '<div class="guide"><div class="gh">指導のポイント</div><table class="it">'+rows.map(r=>'<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>').join("")+'</table></div>';
}

const LS_KEY = "univ_fc_marks_v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e){ marks = {}; }

const items = D.map((r,i)=>({id:i,name:r[0],cat:r[1],type:r[2],pref:r[3],feats:r[4],memo:r[5]}));
let activeCats = new Set(Object.keys(CATS));
let order = items.map(x=>x.id);
let deck = []; let idx = 0;

const $ = id => document.getElementById(id);
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function buildChips(){
  const wrap = $("chips"); wrap.innerHTML="";
  const all = document.createElement("button");
  all.className="chip"; all.textContent="すべて"; all.setAttribute("aria-pressed", activeCats.size===Object.keys(CATS).length);
  all.onclick=()=>{ activeCats = activeCats.size===Object.keys(CATS).length ? new Set() : new Set(Object.keys(CATS)); buildChips(); rebuild(); };
  wrap.appendChild(all);
  for(const [k,v] of Object.entries(CATS)){
    const n = items.filter(x=>x.cat===k).length;
    const b = document.createElement("button");
    b.className="chip"; b.innerHTML = esc(v.label)+'<span class="n">'+n+'</span>';
    b.setAttribute("aria-pressed", activeCats.has(k));
    b.onclick=()=>{ activeCats.has(k)?activeCats.delete(k):activeCats.add(k); buildChips(); rebuild(); };
    wrap.appendChild(b);
  }
}

function rebuild(keepPos){
  const q = $("q").value.trim().toLowerCase();
  const f = $("filt").value;
  deck = order.map(i=>items[i]).filter(x=>{
    if(!activeCats.has(x.cat)) return false;
    const kf=$("kindf").value; if(kf==="pub"){ if(!["国立","公立"].includes(kindOf(x)) && !(kindOf(x)==="専門職大学"&&/公立/.test(x.type))) return false; } else if(kf && kindOf(x)!==kf) return false;
    if(f==="unknown" && marks[x.id]!=="u") return false;
    if(f==="unseen" && marks[x.id]) return false;
    if(q){ const hay=(x.name+x.pref+x.type+x.feats.join("")+x.memo+CATS[x.cat].label).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(!keepPos) idx = 0;
  if(idx>=deck.length) idx = Math.max(0,deck.length-1);
  render(); renderList();
}

const KIND_COLOR={"国立":"#1f4e79","公立":"#2a7f62","私立":"#b0532a","大学校":"#4b5563","専門職大学":"#b8860b"};
function kindOf(x){
  if(x.cat==="daigakkou") return "大学校";
  if(x.cat==="senmon"||/専門職大学/.test(x.name)) return "専門職大学";
  if(/国立/.test(x.type)) return "国立"; if(/公立/.test(x.type)) return "公立"; return "私立";
}
function kindDetail(x){ const k=kindOf(x); if(k==="専門職大学") return /公立/.test(x.type)?"公立":"私立"; if(k==="大学校") return x.type; return ""; }
function metaPrefix(x){ const k=kindOf(x); return (k==="国立"||k==="公立"||k==="私立")?"":esc(x.type)+'｜'; }
function badge(x){ const k=kindOf(x); const d=kindDetail(x); return '<span class="kind" style="background:'+KIND_COLOR[k]+'">'+k+(k==="専門職大学"&&d?'（'+d+'）':'')+'</span>'; }
function statusTag(x){ return marks[x.id]==="k"?'<span class="status k">✓ 覚えた</span>':marks[x.id]==="u"?'<span class="status u">● まだ</span>':''; }

  $("stat").textContent = "習得 "+known+"/"+total;
  $("barfill").style.width = total? (known/total*100)+"%" : "0";
  if(!deck.length){
    $("pos").textContent="0 / 0";
    $("front").innerHTML='<div class="empty" style="border:0">該当なし</div>';
    $("back").innerHTML=""; return;
  }
  const x = deck[idx];
  setArt(x);
  $("front").style.justifyContent = $("mode").value==="name" ? "center" : "flex-start";
  $("pos").textContent = (idx+1)+" / "+deck.length;
  const featList = '<ul>'+x.feats.map(f=>'<li>'+esc(f)+'</li>').join("")+'</ul>';
  const memo = guideBlock(x);
  if($("mode").value==="name"){
    $("front").innerHTML = '<div>'+badge(x)+statusTag(x)+'</div><div class="uname">'+esc(x.name)+'</div><div class="meta">'+metaPrefix(x)+esc(x.pref)+'</div>';
    $("back").innerHTML = '<div>'+badge(x)+statusTag(x)+'</div><h2>'+esc(x.name)+hpLink(x.name)+'</h2>'+featList+memo+cardNews(x.name)+infoBlock(x.name)+examBlock(x.name);

    $("back").innerHTML = '<div>'+badge(x)+statusTag(x)+'</div><div id="resultLine" class="judge" style="text-align:center"></div><div class="uname" style="text-align:center;margin-top:4px">'+esc(x.name)+'</div><div class="meta" style="text-align:center">'+esc(x.pref)+' '+hpLink(x.name)+'</div><div style="margin-top:14px">'+memo+cardNews(x.name)+infoBlock(x.name)+examBlock(x.name)+'</div>';

}

function flip(){ if(!deck.length) return; if($("mode").value==="type" && !answered) return; $("card").classList.toggle("flipped"); $("back").scrollTop=0; $("front").scrollTop=0; }
function go(d){ if(!deck.length) return; if(d>0 && idx===deck.length-1){ shuffleOrder(); rebuild(); return; } idx=(idx+d+deck.length)%deck.length; render(); }
function mark(v){ if(!deck.length) return; const x=deck[idx]; marks[x.id]=v; saveMarks();
  const f=$("filt").value;
  if((f==="unknown"&&v==="k")||f==="unseen"){ rebuild(true); } else { go(1); } }

$("card").onclick=flip;
$("next").onclick=()=>go(1); $("prev").onclick=()=>go(-1);
$("markK").onclick=()=>mark("k"); $("markU").onclick=()=>mark("u");
$("q").oninput=()=>rebuild(); $("kindf").onchange=()=>rebuild(); $("filt").onchange=()=>rebuild(); $("mode").onchange=()=>render();
function shuffleOrder(){ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} }
$("toggleList").onclick=()=>{ const lv=$("listview"), cw=$("cardwrap"); const on = lv.style.display!=="block";
  lv.style.display=on?"block":"none"; cw.style.display=on?"none":"block"; $("toggleList").textContent=on?"カード":"一覧"; renderList(); };
document.addEventListener("keydown",e=>{
  if($("v-cards").hidden) return;
  if($("mode").value==="type" && answered && e.key==="Enter"){ e.preventDefault(); go(1); return; }
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.code==="Space"){e.preventDefault();flip();}
  else if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="k"||e.key==="K") mark("k"); else if(e.key==="u"||e.key==="U") mark("u");
});
let sx=null;
$("card").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("card").addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50){ go(dx<0?1:-1); } sx=null; });

function showView(){
  const v=(location.hash||"#map").slice(1);
  const view=["cards","map","news","ai"].includes(v)?v:"map";
  for(const id of ["cards","map","news","ai"]) $("v-"+id).hidden = id!==view;
  document.body.classList.toggle("wide", view==="map");
  document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===view));
  if(view==="map") initMap();
  if(view==="news") renderNews();
}
window.addEventListener("hashchange",showView);

  if(f.licenses&&f.licenses.length) parts.push("資格:"+f.licenses.join("・"));
  if(f.careers) parts.push("進路:"+f.careers);
  const d=f.difficulty; if(d&&(d.hensachi||d.kyotei)) parts.push("難易度:"+[d.hensachi&&("偏差値"+d.hensachi),d.kyotei&&("共テ"+d.kyotei)].filter(Boolean).join(" "));
  if(f.tuition&&f.tuition.amount!=null) parts.push("初年度納付金:"+f.tuition.amount+"円");
  if(e.general&&e.general.ratio!=null) parts.push("一般倍率:"+e.general.ratio);
  parts.push("担任メモ:"+x.memo);
  return parts.join("｜");
}
function grams(t){ const s=new Set(); const c=t.replace(/[\s、。・,./／()（）「」]/g,""); for(let i=0;i<c.length-1;i++) s.add(c.substr(i,2)); return s; }
let PROFILE_CACHE=null;
function profiles(){ if(!PROFILE_CACHE){ PROFILE_CACHE=items.map(x=>{ const t=profile(x); return {x,t,g:grams(t)}; });
  const df=new Map(); for(const p of PROFILE_CACHE) for(const k of p.g) df.set(k,(df.get(k)||0)+1); PROFILE_CACHE.df=df; } return PROFILE_CACHE; }
function prefilter(q,region,type,limit){
  const P=profiles(), N=P.length, qg=[...grams(q)];
  // 多くの学校に出てくる文字の組み合わせほど軽く（IDF）
  const w=new Map(qg.map(k=>[k,Math.log((N+1)/((P.df.get(k)||0)+1))]));
  return P.filter(({x})=>(!region||regionOf(x.pref)===region)&&(!type||typeKey(x)===type)&&x.name!=="電動モビリティシステム専門職大学")
    .map(p=>{ let sc=0; for(const k of qg) if(p.g.has(k)) sc+=w.get(k); return {x:p.x,t:p.t,sc}; })
    .sort((a,b)=>b.sc-a.sc).slice(0,limit);
}
let aiCtl=null, sampleFn=null;
(async()=>{ try{ sampleFn = (window.claude&&claude.use) ? await claude.use("sample") : null; }catch(e){ sampleFn=null; }
  if(!sampleFn){ $("ai-status").textContent="この画面でAIおすすめは使えません（Claudeの公開ページで開くと使えます）。"; $("ai-go").disabled=true; } })();
$("ai-stop").onclick=()=>aiCtl&&aiCtl.abort();
$("ai-go").onclick=async()=>{
  if(!sampleFn) return;
  const job=$("ai-job").value.trim(), study=$("ai-study").value.trim();
  if(!job&&!study){ $("ai-status").textContent="職業か学びたい学問のどちらかを入力してください。"; return; }
  const region=$("ai-region").value, type=$("ai-type").value;
  const q=[job,study,$("ai-other").value].join(" ");
  const cands=prefilter(q,region,type,90);
  if(!cands.length){ $("ai-status").textContent="条件に合う学校がありません。"; return; }
  const prompt=`あなたは日本の高校の進路指導を支える専門家です。以下の生徒の希望に合う進学先を、候補リストの中だけから最大8校選び、合う順に並べてください。
候補リストにない学校は絶対に挙げないこと。候補の情報に書かれていない事実（偏差値・資格・就職先など）を作らないこと。不確かな点は caution に書くこと。
生徒の希望:
- 目指している職業: ${job||"未定"}
- 学びたい学問・興味: ${study||"未定"}
- 地域: ${region||"こだわらない"}
- 設置区分: ${({pub:"国公立",pri:"私立",dai:"大学校"})[type]||"こだわらない"}
- 学力の目安: ${$("ai-level").value||"不明"}
- 学費の上限: ${$("ai-budget").value||"不明"}
- その他: ${$("ai-other").value||"なし"}

出力は次の形のJSON配列だけ:
[{"name":"候補リストの学校名そのまま","reason":"この生徒に合う理由（2文以内）","points":["根拠となる学部・資格・進路など（候補情報から）", "..."],"caution":"注意点（学力・学費・距離・入試方式など、なければ空文字）"}]

候補リスト（1行1校）:
${cands.map(c=>c.t).join("\n")}`;
  aiCtl=new AbortController(); $("ai-go").disabled=true; $("ai-stop").hidden=false; $("ai-out").innerHTML="";
  $("ai-status").textContent=`${items.length}校から絞り込んだ${cands.length}校をAIが検討中…（30秒〜1分ほどかかります）`;
  try{
    const res=await sampleFn.json(prompt,{signal:aiCtl.signal,modelTier:"default"});
    const list=(Array.isArray(res)?res:[]).filter(r=>r&&items.some(x=>x.name===r.name)).slice(0,8);
    if(!list.length){ $("ai-status").textContent="おすすめを作れませんでした。条件を変えてもう一度お試しください。"; return; }
    $("ai-status").textContent="AIの提案です。最終判断は募集要項と本人の意思で。";
    $("ai-out").innerHTML=list.map((r,i)=>{ const x=items.find(y=>y.name===r.name);
      return '<div class="airec"><h3><span class="rk">#'+(i+1)+'</span>'+badge(x)+esc(x.name)+'<span class="sub2">'+metaPrefix(x)+esc(x.pref)+'</span></h3><div class="why">'+esc(String(r.reason||""))+'</div>'+
      (Array.isArray(r.points)&&r.points.length?'<ul class="pts">'+r.points.slice(0,4).map(p=>'<li>'+esc(String(p))+'</li>').join("")+'</ul>':'')+
      (r.caution?'<div class="caut">注意：'+esc(String(r.caution))+'</div>':'')+
      '<div class="acts"><button class="btn" data-card="'+x.id+'">カードを見る</button><button class="btn" data-map="'+esc(x.name)+'">地図で見る</button>'+hpLink(x.name)+'</div></div>'; }).join("");
    $("ai-out").querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>openCard(+b.dataset.card));
    $("ai-out").querySelectorAll("[data-map]").forEach(b=>b.onclick=()=>{ location.hash="#map"; setTimeout(()=>selectUniv(b.dataset.map),80); });
  }catch(e){
    const c=e&&e.code; $("ai-status").textContent = c==="cancelled"?"停止しました。": c==="not_granted"||c==="sampling_disabled"?"AIの利用が許可されていません。": c==="rate_limited"?"利用が集中しています。少し待ってからお試しください。":"うまく作れませんでした。もう一度お試しください。";
  }finally{ $("ai-go").disabled=false; $("ai-stop").hidden=true; }
};

shuffleOrder(); rebuild(); showView();
</script>
